name: Mirror to public
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Push to mirror repo (workflow除く)
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          MIRROR_REPO: ${{ vars.MIRROR_REPO }}
        run: |
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "MIRROR_TOKEN is empty"
            exit 1
          fi
          rm -rf .github
          git add -A
          git -c user.name="mirror-bot" -c user.email="mirror@users.noreply.github.com" commit -m "sync $( date -u +%Y-%m-%dT%H:%M:%SZ )" --allow-empty
          git -c credential.helper= -c http.extraheader= push --force "https://x-access-token:${MIRROR_TOKEN}@github.com/${MIRROR_REPO}.git" main:main
